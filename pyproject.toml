[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcecheck"
version = "0.1.0"
description = "Flag sentences in an edited text that add words not found in its source."
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"

[project.urls]
Homepage = "https://github.com/jburcsik/sourcecheck"

[project.scripts]
sourcecheck = "sourcecheck:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["sourcecheck"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
