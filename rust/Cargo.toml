[package]
name = "sourcecheck"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Flag sentences in an edited text that add words not found in its source."
license = "MIT"
repository = "https://github.com/jburcsik/sourcecheck"
readme = "../README.md"

[[bin]]
name = "sourcecheck"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
